name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Adds a 'Run workflow' button on the Actions tab, so a pipeline can be
  # started by hand without pushing an empty commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Auth gateway smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      # `node --check` catches what a typecheck cannot in plain JS: unbalanced
      # braces, stray tokens, broken async syntax.
      - name: Parse every server module
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find src -name '*.js' -not -path '*/node_modules/*')
          echo "parsed $count modules"

      # The full suite: admin auth, user login, app registration, secret
      # rotation, open-redirect rejection, rate limiting, security headers and
      # cascade delete. 46 assertions against a real server and a real database.
      # Exits non-zero on any failure, so a red stage here blocks the merge.
      - name: Smoke test
        env:
          APP_DIR: ${{ github.workspace }}
          PORT: '4040'
          DATA_DIR: ${{ github.workspace }}/data
          LOG: ${{ runner.temp }}/agw-server.log
        run: ./agw-test.sh

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-app-server-log
          path: ${{ runner.temp }}/agw-server.log
          retention-days: 7